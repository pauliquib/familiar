# Vygenerováno: python3 -m familiar.skin_export (zdroj familiar/sprites.py).
# Formát popisuje docs/skiny.md.

[skin]
name = "Robo-kun Smaragd"
size = [32, 32]
anchor = [16, 31]
facing = "right"
author = "Pixel Familiars"
license = "CC-BY-4.0"

[layers]
body = "body.png"
fx = "fx.png"
face = "face.png"
acc = "acc.png"
emote = "emote.png"
drone = "drone.png"

[palettes]
base = "pal/base.gpl"
warm = "pal/warm.gpl"
cold = "pal/cold.gpl"
faded = "pal/faded.gpl"

[activity]
idle = "idle"
listening = "listen"
thinking = "think"
waiting = "wave"
success = "hop"
error = "stumble"
sleeping = "sleep"
gone = "sleep"
walking = "walk"
working = { Bash = "work_bash", Edit = "work_edit", Write = "work_edit", NotebookEdit = "work_edit", Read = "work_search", Grep = "work_search", Glob = "work_search", WebSearch = "work_search", WebFetch = "work_search", ToolSearch = "work_search", default = "work_bash" }

[mood]
klid = { palette = "base" }
radost = { mouth = "smile", palette = "warm", emote = "heart" }
zvedavost = { eyes = "wide", mouth = "o", palette = "base", emote = "question" }
frustrace = { eyes = "angry", mouth = "frown", palette = "cold", emote = "storm" }
zmatek = { eyes = "dazed", mouth = "wave", palette = "base", emote = "spiral" }
unava = { eyes = "droopy", palette = "faded", tempo = 0.6 }

[face]
# snímky tagu, kde výraz určuje animace a nálada ho nepřepíše (true = všechny)
keep_eyes = { idle = [13], listen = true, wave = true, hop = true, stumble = true, sleep = true }
keep_mouth = { listen = true, wave = true, hop = true, stumble = true }
